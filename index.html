<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jellybet</title>
<style>
#status { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
  background: radial-gradient(ellipse at 50% 35%, #2A1450 0%, #0A0614 70%); visibility: hidden; font-family: 'Arial Rounded MT Bold', 'Helvetica Neue', Arial, sans-serif; }
#status h1 { margin: 0 0 28px; font-size: 44px; letter-spacing: 3px; color: #FFC21A; text-shadow: 0 0 18px #FF8A00, 0 3px 0 #5A1E00; }
#bar { width: min(64vw, 320px); height: 14px; border-radius: 7px; background: #00000066; border: 2px solid #5FE0F0; box-shadow: 0 0 12px #5FE0F088; overflow: hidden; }
#fill { width: 0%; height: 100%; background: linear-gradient(90deg, #5FE0F0, #FF4FB8); transition: width .15s linear; }
#pct { margin-top: 14px; color: #ffffffcc; font-size: 14px; }
#status-notice { display: none; background-color: #5b3943; border: 1px solid #9b3943; border-radius: 8px; color: #e0e0e0; line-height: 1.3; margin: 0 24px; padding: 16px; text-align: center; }
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jellybet">
<meta name="theme-color" content="#0A0614">
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden; position: fixed; inset: 0;
  background: #0A0614; overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
</style>
<script>
/* No page zoom/scroll gestures; unlock Web Audio on the first real touch or click. */
(function () {
  var opts = { passive: false };
  ['gesturestart', 'gesturechange', 'gestureend', 'dblclick', 'contextmenu'].forEach(function (e) {
    document.addEventListener(e, function (ev) { ev.preventDefault(); }, opts);
  });
  document.addEventListener('touchmove', function (ev) { ev.preventDefault(); }, opts);
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { return; }
  var ctxs = [];
  var P = new Proxy(AC, { construct: function (T, a) { var c = new T(...a); ctxs.push(c); return c; } });
  window.AudioContext = P;
  if (window.webkitAudioContext) { window.webkitAudioContext = P; }
  function unlock() { ctxs.forEach(function (c) { if (c.state !== 'running') { c.resume(); } }); }
  ['touchend', 'pointerup', 'mouseup', 'keydown'].forEach(function (e) {
    window.addEventListener(e, unlock, { capture: true, passive: true });
  });
})();
</script>
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>Your browser does not support JavaScript.</noscript>
<div id="status">
  <h1>JELLYBET</h1>
  <div id="bar"><div id="fill"></div></div>
  <div id="pct">Loading...</div>
  <div id="status-notice"></div>
</div>
<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2920672,"index.wasm":38057390},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
(function () {
  const overlay = document.getElementById('status');
  const fill = document.getElementById('fill');
  const pct = document.getElementById('pct');
  const notice = document.getElementById('status-notice');
  let initializing = true;
  function showNotice(text) {
    document.getElementById('bar').style.display = 'none';
    pct.style.display = 'none';
    notice.style.display = 'block';
    notice.textContent = text;
    overlay.style.visibility = 'visible';
    initializing = false;
  }
  function fail(err) { console.error(err); showNotice(err instanceof Error ? err.message : String(err)); }
  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length !== 0) {
    if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
      engine.installServiceWorker().then(() => window.location.reload()).catch(fail);
    } else {
      showNotice('The following features required to run this game are missing:\n' + missing.join('\n'));
    }
    return;
  }
  overlay.style.visibility = 'visible';
  engine.startGame({
    onProgress: function (current, total) {
      if (current > 0 && total > 0) {
        const p = Math.min(100, Math.round(current * 100 / total));
        fill.style.width = p + '%';
        pct.textContent = p + '%  (' + (total / 1048576).toFixed(0) + ' MB, first visit only)';
      }
    },
  }).then(() => { overlay.remove(); initializing = false; }, fail);
}());
</script>
</body>
</html>
